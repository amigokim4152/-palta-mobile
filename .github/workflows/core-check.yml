name: Palta Core Check

on:
  pull_request:
  push:
    branches:
      - integration/**

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact dev dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Simulator launcher syntax
        run: bash -n scripts/run-ios-simulator-safe.sh
      - name: Map runtime launcher syntax
        run: bash -n scripts/deploy-map-runtime-safe.sh
      - name: Map Worker typecheck
        run: npx tsc --noEmit --target ES2022 --module ESNext --lib ES2022,DOM infra/cloudflare/src/index.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Core tests
        run: npm test
