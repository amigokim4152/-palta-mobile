name: Palta Core Check

on:
  pull_request:
  push:
    branches:
      - integration/**

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact dev dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Core tests
        run: npm test
      - name: Supabase Local Business discovery adapter
        run: node dist/tests/supabase-local-business-discovery-adapter-tests.js
