name: Palta Mobile Runtime Shell

on:
  push:
    branches:
      - 'integration/**'
    paths:
      - 'apps/mobile/**'
      - 'mobile-overlay/**'
      - 'docs/MOBILE_BOOTSTRAP_COMMANDS.md'
      - 'docs/MOBILE_RUNTIME_DECISION.md'
      - 'scripts/sync-mobile-runtime.mjs'
      - 'scripts/bootstrap-mobile.sh'
      - 'scripts/run-ios-mobile.sh'
      - '.github/workflows/mobile-runtime-shell-check.yml'
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'mobile-overlay/**'
      - 'docs/MOBILE_BOOTSTRAP_COMMANDS.md'
      - 'docs/MOBILE_RUNTIME_DECISION.md'
      - 'scripts/sync-mobile-runtime.mjs'
      - 'scripts/bootstrap-mobile.sh'
      - 'scripts/run-ios-mobile.sh'
      - '.github/workflows/mobile-runtime-shell-check.yml'

jobs:
  mobile-runtime-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Check launcher shell syntax
        run: bash -n scripts/bootstrap-mobile.sh scripts/run-ios-mobile.sh

      - name: Materialize current mobile overlay
        run: node scripts/sync-mobile-runtime.mjs

      - name: Install mobile dependencies
        run: npm ci --prefix apps/mobile

      - name: Typecheck generated mobile runtime
        run: npm --prefix apps/mobile exec -- tsc --noEmit -p apps/mobile/tsconfig.json

      - name: Resolve Expo public config
        run: |
          cd apps/mobile
          npx expo config --type public --json > /tmp/palta-expo-config.json
          node - <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('/tmp/palta-expo-config.json', 'utf8'));
          const expected = {
            name: 'Palta',
            slug: 'palta',
            scheme: 'palta',
            iosBundleIdentifier: 'cl.somospalta.app',
            androidPackage: 'cl.somospalta.app',
          };
          const actual = {
            name: config.name,
            slug: config.slug,
            scheme: config.scheme,
            iosBundleIdentifier: config.ios?.bundleIdentifier,
            androidPackage: config.android?.package,
          };
          const failures = Object.entries(expected)
            .filter(([key, value]) => actual[key] !== value)
            .map(([key, value]) => `${key}: expected ${value}, got ${actual[key]}`);
          if (failures.length) {
            console.error('FAIL: resolved Expo config does not match Palta canonical identity');
            for (const failure of failures) console.error(`- ${failure}`);
            process.exit(1);
          }
          console.log('PASS: resolved Expo config matches Palta canonical identity');
          NODE
