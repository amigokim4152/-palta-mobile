name: Gate 01 Auth Dependencies

on:
  push:
    branches:
      - integration/golden-user-001-v1
    paths:
      - apps/mobile/package.json
      - .github/workflows/gate01-auth-dependencies.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Refresh only the mobile lockfile
        run: npm install --prefix apps/mobile --package-lock-only --ignore-scripts

      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- apps/mobile/package-lock.json; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/package-lock.json
          git commit -m "chore: refresh Gate 01 mobile lockfile"
          git push
