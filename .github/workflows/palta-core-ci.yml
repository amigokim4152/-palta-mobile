name: Palta Core CI

on:
  push:
    branches:
      - integration/**
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Mock API HTTP smoke
        run: |
          npm run mock:api > /tmp/palta-mock-api.log 2>&1 &
          MOCK_PID=$!
          trap 'kill "$MOCK_PID" 2>/dev/null || true' EXIT
          READY=0
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8787/health > /dev/null; then
              READY=1
              break
            fi
            sleep 0.25
          done
          if [ "$READY" -ne 1 ]; then
            cat /tmp/palta-mock-api.log
            exit 1
          fi
          npm run mock:smoke
      - name: Followed updates HTTP smoke
        env:
          PALTA_MOCK_PORT: '8788'
          PALTA_MOCK_BASE_URL: 'http://127.0.0.1:8788'
        run: |
          npm run mock:api > /tmp/palta-following-mock-api.log 2>&1 &
          MOCK_PID=$!
          trap 'kill "$MOCK_PID" 2>/dev/null || true' EXIT
          READY=0
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8788/health > /dev/null; then
              READY=1
              break
            fi
            sleep 0.25
          done
          if [ "$READY" -ne 1 ]; then
            cat /tmp/palta-following-mock-api.log
            exit 1
          fi
          npm run mock:following-smoke
      - name: Operating rules HTTP smoke
        env:
          PALTA_MOCK_PORT: '8789'
          PALTA_MOCK_BASE_URL: 'http://127.0.0.1:8789'
        run: |
          npm run mock:api > /tmp/palta-operating-rules-mock-api.log 2>&1 &
          MOCK_PID=$!
          trap 'kill "$MOCK_PID" 2>/dev/null || true' EXIT
          READY=0
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8789/health > /dev/null; then
              READY=1
              break
            fi
            sleep 0.25
          done
          if [ "$READY" -ne 1 ]; then
            cat /tmp/palta-operating-rules-mock-api.log
            exit 1
          fi
          npm run mock:operating-rules-smoke
      - name: Reviews and corrections HTTP smoke
        env:
          PALTA_MOCK_PORT: '8790'
          PALTA_MOCK_BASE_URL: 'http://127.0.0.1:8790'
        run: |
          npm run mock:api > /tmp/palta-trust-mock-api.log 2>&1 &
          MOCK_PID=$!
          trap 'kill "$MOCK_PID" 2>/dev/null || true' EXIT
          READY=0
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8790/health > /dev/null; then
              READY=1
              break
            fi
            sleep 0.25
          done
          if [ "$READY" -ne 1 ]; then
            cat /tmp/palta-trust-mock-api.log
            exit 1
          fi
          npm run mock:trust-smoke
