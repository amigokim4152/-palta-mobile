name: Palta Core CI

on:
  push:
    branches:
      - integration/**
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: palta-ci
          POSTGRES_DB: palta_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d palta_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: palta-ci
      PGDATABASE: palta_ci
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Ensure PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
          psql --version
      - name: Bootstrap Supabase-compatible migration symbols
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          begin
            if not exists (select 1 from pg_roles where rolname = 'anon') then create role anon nologin; end if;
            if not exists (select 1 from pg_roles where rolname = 'authenticated') then create role authenticated nologin; end if;
            if not exists (select 1 from pg_roles where rolname = 'service_role') then create role service_role nologin; end if;
          end
          $$;
          create schema if not exists auth;
          create or replace function auth.uid() returns uuid
            language sql stable
            as $$ select null::uuid $$;
          SQL
      - name: Apply all preflight migrations on fresh PostGIS
        run: |
          set -euo pipefail
          for migration in infra/db/migrations/*.sql; do
            echo "Applying ${migration}"
            psql -v ON_ERROR_STOP=1 -f "${migration}"
          done
      - name: Verify Core migration objects
        run: |
          set -euo pipefail
          test "$(psql -Atqc "select to_regclass('public.msg_conversation') is not null")" = "t"
          test "$(psql -Atqc "select to_regclass('public.msg_conversation_scope') is not null")" = "t"
          test "$(psql -Atqc "select to_regclass('public.msg_scope_identity') is not null")" = "t"
          test "$(psql -Atqc "select to_regclass('public.msg_timeline_domain_event') is not null")" = "t"
          test "$(psql -Atqc "select to_regclass('public.msg_outbox') is not null")" = "t"
          test "$(psql -Atqc "select to_regclass('public.care_resource_link') is not null")" = "t"
          test "$(psql -Atqc "select to_regclass('public.care_signal_receipt') is not null")" = "t"
