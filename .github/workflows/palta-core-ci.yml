name: Palta Core CI

on:
  push:
    branches:
      - integration/**
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run verify

  cloudflare-commerce-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install pinned Commerce Worker dependencies
        working-directory: infra/cloudflare-commerce/api
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Wrangler dry-run bundle
        working-directory: infra/cloudflare-commerce/api
        run: npm run build:dry

  postgres-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: palta_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d palta_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: palta_ci
    steps:
      - uses: actions/checkout@v6
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Bootstrap Supabase-compatible CI roles
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          begin
            create role anon nologin;
          exception when duplicate_object then null;
          end $$;

          do $$
          begin
            create role authenticated nologin;
          exception when duplicate_object then null;
          end $$;

          do $$
          begin
            create role service_role nologin;
          exception when duplicate_object then null;
          end $$;

          create schema if not exists auth;
          create or replace function auth.uid()
          returns uuid
          language sql
          stable
          as $$ select null::uuid $$;
          SQL
      - name: Apply Palta migrations in order
        run: |
          for migration in infra/db/migrations/*.sql; do
            echo "Applying ${migration}"
            psql -v ON_ERROR_STOP=1 -f "${migration}"
          done
      - name: Verify commerce/payment migration and RLS invariants
        run: psql -v ON_ERROR_STOP=1 -f infra/db/tests/commerce_migration_smoke.sql
      - name: Verify business operational grant RLS invariants
        run: psql -v ON_ERROR_STOP=1 -f infra/db/tests/business_operational_grant_smoke.sql
      - name: Verify split payment commerce state
        run: psql -v ON_ERROR_STOP=1 -f infra/db/tests/split_payment_state_smoke.sql
      - name: Verify provider-confirmed processed payment amount
        run: psql -v ON_ERROR_STOP=1 -f infra/db/tests/payment_processed_amount_smoke.sql
      - name: Verify fiscal execution/provider migration and RLS invariants
        run: psql -v ON_ERROR_STOP=1 -f infra/db/tests/fiscal_execution_smoke.sql
      - name: Verify customer delivery/share-link/CRM RLS invariants
        run: psql -v ON_ERROR_STOP=1 -f infra/db/tests/customer_delivery_smoke.sql
      - name: Verify printer device/routing RLS invariants
        run: psql -v ON_ERROR_STOP=1 -f infra/db/tests/print_device_routing_smoke.sql
      - name: Verify durable print job RLS/idempotency invariants
        run: psql -v ON_ERROR_STOP=1 -f infra/db/tests/print_job_runtime_smoke.sql
