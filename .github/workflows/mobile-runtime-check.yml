name: Palta Mobile Runtime Check

on:
  push:
    branches:
      - 'integration/**'
    paths:
      - 'mobile-overlay/**'
      - 'apps/mobile/**'
      - 'src/**'
      - 'manifest/mobile-runtime-composition.json'
      - 'package.json'
      - 'scripts/sync-mobile-runtime.mjs'
      - 'scripts/compose-mobile-runtime.mjs'
      - 'scripts/watch-runtime-composition.sh'
      - 'scripts/check-mobile-runtime-composition.mjs'
      - 'scripts/check-mobile-runtime-shell.mjs'
      - 'scripts/check-runtime-source-drift.mjs'
      - 'scripts/check-mobile-auth-secrets.mjs'
      - 'scripts/check-supabase-auth-public-settings.mjs'
      - 'scripts/run-ios-mobile.sh'
      - 'scripts/watch-local-business-simulator.sh'
      - '.github/workflows/mobile-runtime-check.yml'
  pull_request:
    paths:
      - 'mobile-overlay/**'
      - 'apps/mobile/**'
      - 'src/**'
      - 'manifest/mobile-runtime-composition.json'
      - 'package.json'
      - 'scripts/sync-mobile-runtime.mjs'
      - 'scripts/compose-mobile-runtime.mjs'
      - 'scripts/watch-runtime-composition.sh'
      - 'scripts/check-mobile-runtime-composition.mjs'
      - 'scripts/check-mobile-runtime-shell.mjs'
      - 'scripts/check-runtime-source-drift.mjs'
      - 'scripts/check-mobile-auth-secrets.mjs'
      - 'scripts/check-supabase-auth-public-settings.mjs'
      - 'scripts/run-ios-mobile.sh'
      - 'scripts/watch-local-business-simulator.sh'
      - '.github/workflows/mobile-runtime-check.yml'

jobs:
  verify-mobile-runtime:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://rqbpbauhkdgsrkbwmkmg.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_QEHIwvil9m4lyE6kJ1ba6w_CjA9_XXh
    defaults:
      run:
        working-directory: mobile-overlay
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: mobile-overlay/package.json

      - name: Check launcher shell syntax
        working-directory: .
        run: bash -n scripts/run-ios-mobile.sh

      - name: Check composed mobile Auth credential boundary
        working-directory: .
        run: node scripts/check-mobile-auth-secrets.mjs

      - name: Check palta-dev public Auth settings
        working-directory: .
        run: node scripts/check-supabase-auth-public-settings.mjs

      - name: Require palta-dev email Auth
        working-directory: .
        run: node scripts/check-supabase-auth-public-settings.mjs email

      - name: Install mobile dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck mobile app and canonical core
        run: npm run typecheck

      - name: Validate Expo config
        run: npm run config

      - name: Bundle composition source iOS JavaScript
        env:
          EXPO_PUBLIC_PALTA_API_BASE_URL: http://127.0.0.1:8787
          EXPO_PUBLIC_ENV: development
          EXPO_PUBLIC_MAP_STYLE_URL: https://palta-edge-preflight.kimeuisin.workers.dev/maps/style.json
        run: npm run bundle:ios

      - name: Validate runtime composition contract
        working-directory: .
        run: node scripts/check-mobile-runtime-composition.mjs

      - name: Report parallel source and ownership drift
        working-directory: .
        run: |
          git fetch --quiet origin '+refs/heads/integration/*:refs/remotes/origin/integration/*'
          node scripts/check-runtime-source-drift.mjs

      - name: Materialize actual composed simulator runtime shell
        working-directory: .
        run: node scripts/compose-mobile-runtime.mjs

      - name: Re-check Auth boundary after runtime composition
        working-directory: .
        run: node scripts/check-mobile-auth-secrets.mjs

      - name: Install simulator runtime dependencies
        working-directory: apps/mobile
        run: npm install --no-audit --no-fund

      - name: Typecheck composed simulator runtime
        working-directory: apps/mobile
        run: npx tsc --noEmit

      - name: Bundle composed iOS simulator runtime
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_PALTA_API_BASE_URL: http://127.0.0.1:8787
          EXPO_PUBLIC_ENV: development
          EXPO_PUBLIC_MAP_STYLE_URL: https://palta-edge-preflight.kimeuisin.workers.dev/maps/style.json
        run: npx expo export --platform ios --output-dir .expo-export/ios-runtime
