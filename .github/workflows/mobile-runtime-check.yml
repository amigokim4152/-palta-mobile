name: Palta Mobile Runtime Check

on:
  push:
    branches:
      - 'integration/**'
    paths:
      - 'mobile-overlay/**'
      - 'apps/mobile/**'
      - 'src/**'
      - 'manifest/mobile-runtime-composition.json'
      - 'package.json'
      - 'scripts/sync-mobile-runtime.mjs'
      - 'scripts/compose-mobile-runtime.mjs'
      - 'scripts/watch-runtime-composition.sh'
      - 'scripts/run-ios-mobile.sh'
      - 'scripts/watch-local-business-simulator.sh'
      - '.github/workflows/mobile-runtime-check.yml'
  pull_request:
    paths:
      - 'mobile-overlay/**'
      - 'apps/mobile/**'
      - 'src/**'
      - 'manifest/mobile-runtime-composition.json'
      - 'package.json'
      - 'scripts/sync-mobile-runtime.mjs'
      - 'scripts/compose-mobile-runtime.mjs'
      - 'scripts/watch-runtime-composition.sh'
      - 'scripts/run-ios-mobile.sh'
      - 'scripts/watch-local-business-simulator.sh'
      - '.github/workflows/mobile-runtime-check.yml'

jobs:
  verify-mobile-runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-overlay
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: mobile-overlay/package.json

      - name: Install mobile dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck mobile app and canonical core
        run: npm run typecheck

      - name: Validate Expo config
        run: npm run config

      - name: Bundle composition source iOS JavaScript
        run: npm run bundle:ios

      - name: Validate runtime composition contract
        working-directory: .
        run: node scripts/check-mobile-runtime-composition.mjs

      - name: Materialize actual composed simulator runtime shell
        working-directory: .
        run: node scripts/compose-mobile-runtime.mjs

      - name: Install simulator runtime dependencies
        working-directory: apps/mobile
        run: npm install --no-audit --no-fund

      - name: Typecheck composed simulator runtime
        working-directory: apps/mobile
        run: npx tsc --noEmit

      - name: Bundle composed iOS simulator runtime
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_PALTA_API_BASE_URL: http://127.0.0.1:8787
          EXPO_PUBLIC_ENV: development
          EXPO_PUBLIC_MAP_STYLE_URL: https://palta-edge-preflight.kimeuisin.workers.dev/maps/style.json
        run: npx expo export --platform ios --output-dir .expo-export/ios-runtime
